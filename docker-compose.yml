services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentweave
      POSTGRES_PASSWORD: agentweave
      POSTGRES_DB: agentweave
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentweave -d agentweave"]
      interval: 2s
      timeout: 3s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.5.0
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3001:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki

  control-api:
    build:
      context: .
      dockerfile: apps/control-api/Dockerfile
    environment:
      CONTROL_API_PORT: 3000
      DATABASE_URL: postgresql://agentweave:agentweave@postgres:5432/agentweave
      NATS_URL: nats://nats:4222
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://agentweave:agentweave@postgres:5432/agentweave
      NATS_URL: nats://nats:4222
      WORKER_ID: worker-local-1
      WORKER_ROLES: pm,pe,coder,qa
      WORKSPACE_ROOT: /workspaces
      AGENTWEAVE_PROVIDER: ${AGENTWEAVE_PROVIDER:-mock}
      AGENTWEAVE_MODEL: ${AGENTWEAVE_MODEL:-}
      CODEX_APP_SERVER_URL: ${CODEX_APP_SERVER_URL:-http://host.docker.internal:3010}
      CODEX_BRIDGE_MODE: ${CODEX_BRIDGE_MODE:-app-server}
      CODEX_CONTAINER_WORKSPACE_ROOT: ${CODEX_CONTAINER_WORKSPACE_ROOT:-/workspaces}
      # The host bridge resolves this path on the operator's machine. Keep it
      # configurable: a repository must never assume a maintainer's home path.
      CODEX_HOST_WORKSPACE_ROOT: ${CODEX_HOST_WORKSPACE_ROOT:-${AGENTWEAVE_HOST_WORKSPACE:-./workspaces}}
      CODEX_BRIDGE_TOKEN: ${CODEX_BRIDGE_TOKEN:-}
      PROVIDER_REQUEST_TIMEOUT_MS: ${PROVIDER_REQUEST_TIMEOUT_MS:-120000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${AGENTWEAVE_HOST_WORKSPACE:-./workspaces}:${CODEX_CONTAINER_WORKSPACE_ROOT:-/workspaces}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      VITE_CONTROL_API_URL: http://localhost:3000
      VITE_CONTROL_WS_URL: ws://localhost:3000/events
    ports:
      - "5173:5173"
    depends_on:
      - control-api

volumes:
  postgres-data:
  nats-data:
  prometheus-data:
  loki-data:
  grafana-data:
